<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>そーCloud Site</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: ui-sans-serif, system-ui; background: #0f1115; color: #e8eaed; }
    .card { background: #1a1d24; border: 1px solid #2c313a; border-radius: 16px; padding: 36px; max-width: 420px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #9aa0a6; line-height: 1.6; }
    .pill { display: inline-block; background: #5865f2; color: white; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
    code { background: #0f1115; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="pill">そーCloud</span>
    <h1>サイト公開中</h1>
    <p>このページはクラウドが自動ホストしています。<code>public/</code> を置き換えると、自分のサイトになります。</p>
  </div>
</body>
</html>
